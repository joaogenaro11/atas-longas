[project]
name = "transcricao-local"
version = "0.1.0"
description = "Transcrição de áudio local (Whisper) — upload → TXT, sem APIs pagas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "psutil>=5.9",
    # Backend multiplataforma (Intel/Linux/Windows/Docker, CPU)
    "faster-whisper>=1.1.0",
]

[project.optional-dependencies]
# Backend otimizado para Apple Silicon. Instale com:  uv sync --extra mlx
# (só funciona rodando NATIVAMENTE no Mac, não dentro do Docker.)
mlx = [
    "mlx-whisper>=0.4.0",
]

[tool.uv]
package = false
